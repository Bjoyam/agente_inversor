[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agente_inversor"
version = "0.1.0"
description = "Proyecto final: agente inversor con aprendizaje por refuerzo (Stable-Baselines3, MLflow, Optuna)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Leonar Socarrás Molina", email = "leonarsomo@unisabana.edu.co" },
    { name = "John Jairo Serrano Cifuentes", email = "johnseci@unisabana.edu.co" },
    { name = "Brezhnev Joya Miranda", email = "brezhnevjomi@unisabana.edu.co" },
    { name = "Gabriel Alonso Lizano Alvarado", email = "gabriellial@unisabana.edu.co" },
    { name = "Bryan Johann Aranzazu Medina", email = "bryanarme@unisabana.edu.co" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "gym-anytrading>=2.0.0",
    "gymnasium>=1.2",
    "matplotlib>=3.8",
    "mlflow>=3.1",
    "optuna>=4.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "stable-baselines3>=2.7",
    "torch>=2.4",
]

[project.scripts]
agente-inversor = "agente_inversor.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agente_inversor"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
