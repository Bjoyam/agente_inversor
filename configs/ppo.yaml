# PPO sobre el entorno de inversion.
#   agente-inversor entrenar --config configs/ppo.yaml
#   agente-inversor entrenar --config configs/ppo.yaml --recompensa diferencial

experimento: agente_inversor
algo: ppo
pasos: 100_000
semillas: [0, 1, 2, 3, 4]

entorno:
  ventana: 20         # dias de historia para los indicadores
  costo: 0.001        # 0,1 % del capital que cambia de manos
  episodio: 252       # un ano bursatil por episodio de entrenamiento
  recompensa: log     # log | diferencial | aversion

hiper:
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  ent_coef: 0.01

tune:
  trials: 15
  pasos: 50_000       # por corrida de cada trial
  semillas: [0, 1]    # el trial se puntua con la mediana de estas semillas
  search_space:
    learning_rate: {type: float, low: 3.0e-5, high: 1.0e-3, log: true}
    ent_coef: {type: float, low: 1.0e-3, high: 0.1, log: true}
    gamma: {type: categorical, choices: [0.9, 0.95, 0.99]}
    n_epochs: {type: categorical, choices: [3, 5, 10]}
