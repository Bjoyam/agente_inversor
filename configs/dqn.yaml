# DQN sobre el entorno de inversion.
#   agente-inversor entrenar --config configs/dqn.yaml

experimento: agente_inversor
algo: dqn
pasos: 100_000
semillas: [0, 1, 2, 3, 4]

entorno:
  ventana: 20
  costo: 0.001
  episodio: 252
  recompensa: log

hiper:
  learning_rate: 1.0e-4
  buffer_size: 50_000
  learning_starts: 1_000
  batch_size: 64
  gamma: 0.99
  train_freq: 4
  target_update_interval: 1_000
  exploration_fraction: 0.3
  exploration_final_eps: 0.05

tune:
  trials: 15
  pasos: 50_000
  semillas: [0, 1]
  search_space:
    learning_rate: {type: float, low: 3.0e-5, high: 1.0e-3, log: true}
    gamma: {type: categorical, choices: [0.9, 0.95, 0.99]}
    target_update_interval: {type: categorical, choices: [500, 1000, 2000]}
    exploration_final_eps: {type: categorical, choices: [0.02, 0.05, 0.1]}
