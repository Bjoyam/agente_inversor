name: CI

on: [push, pull_request]

jobs:
  lint-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependencias
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Pruebas
        run: uv run pytest -q
